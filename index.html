<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>לוח חמלים</title>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, doc, setDoc, getDoc, getDocs,
    addDoc, updateDoc, deleteDoc, query, where, orderBy, Timestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ── CONFIG ── Replace with your Firebase project config ──────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyBZwWLwUenT82KVnvC6ZqyD2xuODvtLlCA",
    authDomain: "hamalim-f60dc.firebaseapp.com",
    projectId: "hamalim-f60dc",
    storageBucket: "hamalim-f60dc.firebasestorage.app",
    messagingSenderId: "4462919907",
    appId: "1:4462919907:web:922f1ef28380bfe655c5d6"
  };
  // ─────────────────────────────────────────────────────────────────────────

  const app   = initializeApp(firebaseConfig);
  const auth  = getAuth(app);
  const db    = getFirestore(app);

  window.__fb = { auth, db, signInWithEmailAndPassword, signOut, onAuthStateChanged,
    createUserWithEmailAndPassword, collection, doc, setDoc, getDoc, getDocs,
    addDoc, updateDoc, deleteDoc, query, where, orderBy, Timestamp };
</script>

<style>
  /* ── DESIGN: Clean slate-dark industrial, monospaced accents ── */
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg:       #0d0f14;
    --surface:  #161922;
    --card:     #1e2230;
    --border:   #2a2f3e;
    --muted:    #4a5068;
    --text:     #e8eaf0;
    --sub:      #8890aa;
    --accent:   #4f8fff;
    --accent2:  #ff6b6b;
    --green:    #4ecb71;
    --yellow:   #f5c542;
    --purple:   #a78bfa;
    --orange:   #fb923c;
    --pink:     #f472b6;
    --radius:   12px;
    --mono:     'DM Mono', monospace;
    --sans:     'DM Sans', sans-serif;
    --nav-h:    56px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── SCREENS ── */
  .screen { display: none; min-height: 100dvh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ── AUTH ── */
  #screen-auth {
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    background: var(--bg);
  }

  .auth-logo {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .auth-title {
    font-size: 28px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 40px;
    line-height: 1.2;
  }

  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    width: 100%;
  }

  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--sub);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .form-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: var(--sans);
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--sub);
    margin-top: 10px;
  }
  .btn-danger { background: var(--accent2); color: #fff; }
  .btn-sm {
    width: auto;
    padding: 8px 16px;
    font-size: 13px;
    border-radius: 6px;
  }

  .auth-error {
    background: rgba(255,107,107,0.12);
    border: 1px solid rgba(255,107,107,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--accent2);
    margin-bottom: 14px;
    display: none;
  }

  /* ── TOP BAR ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: var(--nav-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-logo {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .topbar-user {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    flex-shrink: 0;
  }

  .role-badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .role-badge.mod { background: rgba(79,143,255,0.15); color: var(--accent); }
  .role-badge.user { background: rgba(78,203,113,0.15); color: var(--green); }

  /* ── ICON BUTTON ── */
  .icon-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--sub);
    transition: color 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }

  /* ── MAIN CONTENT ── */
  .main-content {
    flex: 1;
    overflow-y: auto;
    padding: 0 0 80px;
  }

  /* ── SECTION LABEL ── */
  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 20px 20px 8px;
  }

  /* ── WEEK NAV ── */
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
  }

  .week-label {
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    flex: 1;
  }

  .week-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--sub);
    display: block;
    font-weight: 400;
    margin-top: 2px;
  }

  /* ── DAY LIST ── */
  .day-block {
    margin: 0 20px 16px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .day-header {
    background: var(--surface);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .day-name {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--sub);
  }

  .day-date {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .day-today .day-name { color: var(--accent); }
  .day-today .day-date {
    background: var(--accent);
    color: #fff;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  .events-list { background: var(--card); }

  .event-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .event-item:last-child { border-bottom: none; }
  .event-item:hover { background: rgba(255,255,255,0.03); }

  .event-color-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-top: 4px;
    flex-shrink: 0;
  }

  .event-info { flex: 1; min-width: 0; }

  .event-title {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .event-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--sub);
    margin-top: 2px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .event-type-pill {
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(255,255,255,0.07);
    color: var(--sub);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-top: 4px;
    display: inline-block;
  }

  .shared-badge {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--purple);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .empty-day {
    background: var(--card);
    padding: 16px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    font-family: var(--mono);
  }

  /* ── FAB ── */
  .fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(79,143,255,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    z-index: 200;
  }
  .fab:active { transform: scale(0.93); }
  .fab.hidden { display: none; }

  /* ── BOTTOM NAV (mod) ── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 150;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 0 12px;
    cursor: pointer;
    color: var(--muted);
    transition: color 0.2s;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    gap: 4px;
    border: none;
    background: none;
  }
  .nav-item svg { width: 20px; height: 20px; }
  .nav-item.active { color: var(--accent); }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 500;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }

  .modal-sheet {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 430px;
    max-height: 90dvh;
    overflow-y: auto;
    padding: 8px 0 40px;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    margin: 0 auto 20px;
  }

  .modal-title {
    font-size: 18px;
    font-weight: 600;
    padding: 0 24px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }

  .modal-body { padding: 0 24px; }

  .select-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: var(--sans);
    font-size: 15px;
    color: var(--text);
    outline: none;
    appearance: none;
    transition: border-color 0.2s;
  }
  .select-input:focus { border-color: var(--accent); }

  /* ── COLOR PICKER ── */
  .color-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .color-swatch {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: border-color 0.15s, transform 0.15s;
    flex-shrink: 0;
  }
  .color-swatch:active { transform: scale(0.9); }
  .color-swatch.selected { border-color: var(--text); }

  /* ── USER SEARCH (mod) ── */
  .user-list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .user-list-item:last-child { border-bottom: none; }

  .user-name { font-size: 14px; font-weight: 500; }
  .user-email { font-size: 12px; color: var(--sub); font-family: var(--mono); }

  /* ── SEARCH SCREEN ── */
  .search-bar {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
  }

  .search-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: var(--sans);
    font-size: 15px;
    color: var(--text);
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }

  .search-filters {
    display: flex;
    gap: 8px;
    padding: 0 20px 16px;
    flex-wrap: wrap;
  }

  .filter-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    font-family: var(--mono);
    cursor: pointer;
    color: var(--sub);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-chip.active {
    background: rgba(79,143,255,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  .results-section { padding: 0 20px; }

  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
  }

  .result-event-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .result-users { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }

  .user-tag {
    background: rgba(79,143,255,0.12);
    border: 1px solid rgba(79,143,255,0.25);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    color: var(--accent);
    font-family: var(--mono);
  }

  /* ── USERS MANAGEMENT ── */
  .users-list { padding: 0 20px; }

  .user-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .user-card-info { flex: 1; min-width: 0; }

  .user-card-actions { display: flex; gap: 8px; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 88px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 500;
    z-index: 1000;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
    max-width: 340px;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #toast.success { border-color: rgba(78,203,113,0.4); color: var(--green); }
  #toast.error   { border-color: rgba(255,107,107,0.4); color: var(--accent2); }

  /* ── LOADING ── */
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 40px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-wrap { display: flex; justify-content: center; padding: 40px; }

  /* ── PROFILE (settings) ── */
  .profile-section {
    margin: 20px 20px 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .profile-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .profile-row:last-child { border-bottom: none; }

  .profile-row-label { font-size: 14px; color: var(--sub); font-family: var(--mono); font-size: 12px; }
  .profile-row-value { font-size: 14px; font-weight: 500; }

  /* ── EVENT DETAIL ── */
  .event-detail-color-bar {
    height: 6px;
    border-radius: 3px;
    margin-bottom: 20px;
  }

  .detail-row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 16px;
  }

  .detail-icon { color: var(--sub); flex-shrink: 0; margin-top: 2px; }
  .detail-label { font-family: var(--mono); font-size: 11px; color: var(--sub); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.06em; }
  .detail-value { font-size: 14px; }

  /* ── CHECKBOX ── */
  .checkbox-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .checkbox-item input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

  /* ── DATE TIME ROW ── */
  .dt-row { display: flex; gap: 10px; }
  .dt-row .form-group { flex: 1; }

  /* responsive */
  @media (max-width: 360px) {
    .modal-body { padding: 0 16px; }
  }
</style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════
     AUTH SCREEN
════════════════════════════════════════════════════════════ -->
<div id="screen-auth" class="screen active">
  <div style="text-align:center; margin-bottom: 10px;">
    <!-- <div class="auth-logo"></div> -->
    <div class="auth-title">לוז<br>חמלים</div>
  </div>
  <div class="auth-card">
    <div class="auth-error" id="auth-error"></div>
    <div class="form-group">
      <label class="form-label">שפ משתמש</label>
      <input class="form-input" type="text" id="auth-username" placeholder="שם שלך" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">סיסמה</label>
      <input class="form-input" type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="btn-login">כניסה</button>
    <div style="text-align:center; margin-top: 20px; font-size:12px; color:var(--muted); font-family:var(--mono);">
      יש ליצור קשר עם מר׳ רומן רודוי ליצירת משתמש
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════
     MAIN APP
════════════════════════════════════════════════════════════ -->
<div id="screen-app" class="screen">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-logo">-_-</div>
    <div class="topbar-user">
      <span id="topbar-role-badge" class="role-badge"></span>
      <div class="avatar" id="topbar-avatar">?</div>
      <button class="icon-btn" id="btn-logout" title="יציאה">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- PAGES -->
  <div class="main-content">

    <!-- ── SCHEDULE PAGE ── -->
    <div id="page-schedule" class="page">
      <div class="week-nav">

<!-- ════════════════════════════════════════════════════════════
     APP LOGIC
════════════════════════════════════════════════════════════ -->
<script>
// ── Wait for Firebase to load ──────────────────────────────
function waitForFirebase(cb) {
  if (window.__fb) return cb();
  setTimeout(() => waitForFirebase(cb), 100);
}

// ── CONSTANTS ─────────────────────────────────────────────
const COLORS = ['#4f8fff','#ff6b6b','#4ecb71','#f5c542','#a78bfa','#fb923c','#f472b6','#22d3ee','#e879f9','#94a3b8'];
const EVENT_TYPES = ['משמרת','זירות','תורנות','שיעור'];

// ── STATE ─────────────────────────────────────────────────
let currentUser = null;
let userProfile = null;  // from Firestore
let allUsers    = [];    // moderator cache
let currentWeekOffset = 0;  // weeks from current week
let editingEventId = null;
let selectedColor = COLORS[0];
let selectedUserIds = new Set();

// ── UTILS ─────────────────────────────────────────────────
function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = '', 2800);
}

function formatDate(d) {
  return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}

function localDateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function formatTime(dateStr, timeStr) {
  if (!timeStr) return '—';
  // Simply return HH:MM directly — already in 24h format
  return timeStr.slice(0,5);
}

// Get Sunday of the week containing 'date'
function getWeekStart(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay(); // 0=Sun, 6=Sat
  d.setDate(d.getDate() - day);
  return d;
}

// ── WEEK RANGE ────────────────────────────────────────────
function getWeekDates(offset) {
  const today = new Date();
  const sunday = getWeekStart(today);
  sunday.setDate(sunday.getDate() + offset * 7);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    days.push(d);
  }
  return days;
}

function isModerator() {
  return userProfile && userProfile.role === 'moderator';
}

// ── SCREENS ───────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => { p.style.display = 'none'; });
  document.getElementById(`page-${name}`).style.display = 'block';
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.page === name);
  });
  if (name === 'schedule') renderSchedule();
  if (name === 'users' && isModerator()) loadUsers();
  if (name === 'profile') renderProfile();
}

// ── AUTH ──────────────────────────────────────────────────
waitForFirebase(() => {
  const { auth, onAuthStateChanged } = window.__fb;

  onAuthStateChanged(auth, async user => {
    if (user) {
      currentUser = user;
      await loadUserProfile(user.uid);
      showScreen('screen-app');
      initApp();
    } else {
      currentUser = null;
      userProfile = null;
      showScreen('screen-auth');
    }
  });

  document.getElementById('btn-login').addEventListener('click', async () => {
    const username = document.getElementById('auth-username').value.trim();
    const pass     = document.getElementById('auth-password').value;
    const errEl    = document.getElementById('auth-error');
    errEl.style.display = 'none';
    if (!username || !pass) {
      errEl.textContent = 'יש להכניס שם משתמש וסיסמה';
      errEl.style.display = 'block';
      return;
    }
    try {
      // Look up email by username in Firestore
      const { db, collection, query, where, getDocs } = window.__fb;
      const q = query(collection(db, 'users'), where('username', '==', username));
      const snap = await getDocs(q);
      if (snap.empty) throw new Error('משתמש לא נמצא');
      const userData = snap.docs[0].data();
      if (!userData.email) throw new Error('Account has no email configured');
      await window.__fb.signInWithEmailAndPassword(auth, userData.email, pass);
    } catch(e) {
      errEl.textContent = e.message === 'Firebase: Error (auth/invalid-credential).'
        ? 'סיסמה שגויה'
        : e.message;
      errEl.style.display = 'block';
    }
  });

  // logout buttons
  ['btn-logout','btn-logout-profile'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', () => window.__fb.signOut(auth));
  });
});

async function loadUserProfile(uid) {
  const { db, doc, getDoc } = window.__fb;
  const snap = await getDoc(doc(db, 'users', uid));
  if (snap.exists()) {
    userProfile = { id: uid, ...snap.data() };
  } else {
    // create minimal profile from auth
    userProfile = { id: uid, name: currentUser.email, email: currentUser.email, role: 'user' };
    await window.__fb.setDoc(doc(db, 'users', uid), userProfile);
  }
}

// ── INIT ──────────────────────────────────────────────────
function initApp() {
  // Badge
  const badge = document.getElementById('topbar-role-badge');
  const isMod = isModerator();
  badge.textContent = isMod ? 'Mod' : 'User';
  badge.className = `role-badge ${isMod ? 'mod' : 'user'}`;

  // Avatar
  document.getElementById('topbar-avatar').textContent =
    (userProfile.name || 'U').charAt(0).toUpperCase();

  // Show/hide mod elements
  document.querySelectorAll('.mod-only').forEach(el => {
    if (isMod) el.classList.remove('hidden');
    else el.classList.add('hidden');
  });

  // For regular users: hide bottom nav completely
  if (!isMod) {
    document.getElementById('bottom-nav').style.display = 'none';
    // Also reduce bottom padding since no nav bar
    document.querySelector('.main-content').style.paddingBottom = '20px';
  }

  // Nav
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => showPage(btn.dataset.page));
  });

  // Color picker
  buildColorPicker();

  // Type options for search
  buildTypeOptions();

  // FAB
  document.getElementById('fab').addEventListener('click', () => openEventModal(null));

  // Week nav
  document.getElementById('btn-week-prev').addEventListener('click', () => {
    currentWeekOffset--;
    renderSchedule();
  });
  document.getElementById('btn-week-next').addEventListener('click', () => {
    // Limit: users can only see current week; mods can go 2 weeks ahead
    const maxOffset = isModerator() ? 2 : 1;
    if (currentWeekOffset >= maxOffset) {
      toast('You can\'t view beyond the allowed range', 'error');
      return;
    }
    currentWeekOffset++;
    renderSchedule();
  });

  // Event modal
  document.getElementById('btn-cancel-event').addEventListener('click', closeEventModal);
  document.getElementById('btn-save-event').addEventListener('click', saveEvent);

  // Detail modal
  document.getElementById('btn-close-detail').addEventListener('click', () => {
    document.getElementById('modal-event-detail').classList.remove('open');
  });

  // Search
  document.getElementById('btn-do-search').addEventListener('click', doSearch);

  // Add user
  document.getElementById('btn-add-user').addEventListener('click', () => {
    document.getElementById('add-user-error').style.display = 'none';
    document.getElementById('new-user-name').value = '';
    document.getElementById('new-user-username').value = '';
    document.getElementById('new-user-email').value = '';
    document.getElementById('new-user-pass').value = '';
    document.getElementById('modal-add-user').classList.add('open');
  });
  document.getElementById('btn-cancel-add-user').addEventListener('click', () => {
    document.getElementById('modal-add-user').classList.remove('open');
  });
  document.getElementById('btn-confirm-add-user').addEventListener('click', createUser);

  showPage('schedule');
}

// ── COLOR PICKER ──────────────────────────────────────────
function buildColorPicker() {
  const container = document.getElementById('color-picker');
  container.innerHTML = '';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.style.background = c;
    if (c === selectedColor) sw.classList.add('selected');
    sw.addEventListener('click', () => {
      selectedColor = c;
      container.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
    });
    container.appendChild(sw);
  });
}

function buildTypeOptions() {
  const sel = document.getElementById('search-type');
  EVENT_TYPES.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    sel.appendChild(opt);
  });
}

// ── TIME DISPLAY HELPER ───────────────────────────────────
function getEventTimeDisplay(ev, currentDateStr) {
  const isMultiDay = ev.dateEnd && ev.dateEnd !== ev.date;
  if (!isMultiDay) {
    // Single day
    return ev.time ? (ev.timeEnd ? `${formatTime(null,ev.time)} – ${formatTime(null,ev.timeEnd)}` : formatTime(null,ev.time)) : '—';
  }
  // Multi-day: show split
  if (currentDateStr === ev.date) {
    // First day: start time – 23:59
    return `${formatTime(null,ev.time)} – 23:59`;
  } else if (currentDateStr === ev.dateEnd) {
    // Last day: 00:00 – end time
    return `00:00 – ${formatTime(null,ev.timeEnd)}`;
  } else {
    // Middle day: all day
    return '00:00 – 23:59';
  }
}

// ── SCHEDULE ──────────────────────────────────────────────
async function renderSchedule() {
  const container = document.getElementById('schedule-container');
  if (!container) return;
  container.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';

  const days = getWeekDates(currentWeekOffset);
  const today = new Date(); today.setHours(0,0,0,0);

  // Week label
  const wStart = days[0], wEnd = days[6];
  const opts = { month:'short', day:'numeric' };
  const weekLabelEl = document.getElementById('week-label');
  const weekSubEl   = document.getElementById('week-sub');

  if (weekSubEl) weekSubEl.textContent =
    `${wStart.toLocaleDateString('en-US', opts)} – ${wEnd.toLocaleDateString('en-US', opts)}`;

  if (weekLabelEl) {
    if (currentWeekOffset < 0) {
      weekLabelEl.textContent = 'שבוע שעבר';
    } else if (currentWeekOffset > 14) {
      weekLabelEl.textContent = `+${currentWeekOffset} שבוע{currentWeekOffset>1?'s':''}`;
    } else if (currentWeekOffset > 7) {
      weekLabelEl.textContent = 'שבוע הבא';
    } else {
      weekLabelEl.textContent = 'השבוע הנוכחי';
    }
  }

  // Fetch events
  const dateStrings = days.map(d => localDateStr(d));
  let events = [];
  try {
    events = await fetchEventsForDates(dateStrings);
  } catch(e) {
    container.innerHTML = `<div style="padding:24px;text-align:center;color:var(--accent2);font-size:14px;">${e.message}</div>`;
    return;
  }

  // Cache all users once for moderator
  if (isModerator() && allUsers.length === 0) await loadUsers();

  // Build HTML
  container.innerHTML = '';
  days.forEach(day => {
    const dateStr = localDateStr(day);
    const dayEvents = events.filter(e => {
      const start = e.date;
      const end   = e.dateEnd || e.date;
      return dateStr >= start && dateStr <= end;
    }).sort((a,b) => (a.time||'').localeCompare(b.time||''));

    const isToday = day.getTime() === today.getTime();

    const block = document.createElement('div');
    block.className = 'day-block' + (isToday ? ' day-today' : '');

    const dayNames = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
    block.innerHTML = `
      <div class="day-header">
        <span class="day-name">${dayNames[day.getDay()]}</span>
        <span class="day-date">${day.getDate()}</span>
      </div>
      <div class="events-list" id="day-${dateStr}"></div>
    `;

    const list = block.querySelector(`#day-${dateStr}`);

    if (dayEvents.length === 0) {
      list.innerHTML = '<div class="empty-day">איו אירועים -_-</div>';
    } else {
      dayEvents.forEach(ev => {
        const item = document.createElement('div');
        item.className = 'event-item';

        // Is this a shared event (multiple userIds)?
        const isShared = ev.userIds && ev.userIds.length > 1;

        item.innerHTML = `
          <div class="event-color-dot" style="background:${ev.color||'#4f8fff'}"></div>
          <div class="event-info">
            <div class="event-title">${ev.title}</div>
            <div class="event-meta">
              <span>${getEventTimeDisplay(ev, dateStr)}</span>
            </div>
            <span class="event-type-pill">${ev.type||'event'}</span>
            ${isShared ? '<div class="shared-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg> Shared event</div>' : ''}
          </div>
          ${isModerator() ? '<svg style="color:var(--muted);flex-shrink:0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>' : ''}
        `;

        item.addEventListener('click', () => {
          if (isModerator()) openEventModal(ev);
          else openEventDetail(ev);
        });

        list.appendChild(item);
      });
    }

    container.appendChild(block);
  });
}

async function fetchEventsForDates(dateStrings) {
  const { db, collection, query, where, getDocs } = window.__fb;

  // Build date range query
  const first = dateStrings[0], last = dateStrings[dateStrings.length-1];

  let q;
  if (isModerator()) {
    // Fetch events that start within the week OR end within the week
    q = query(collection(db,'events'), where('date','<=',last), where('date','>=',first));
  } else {
    q = query(collection(db,'events'),
      where('date','>=',first),
      where('date','<=',last),
      where('userIds','array-contains', currentUser.uid)
    );
  }

  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

// ── EVENT MODAL (mod) ──────────────────────────────────────
async function openEventModal(event) {
  editingEventId = event ? event.id : null;

  document.getElementById('modal-event-title').textContent = event ? 'Edit Event' : 'New Event';
  document.getElementById('ev-title').value = event?.title || '';
  document.getElementById('ev-type').value  = event?.type  || '';
  document.getElementById('ev-date').value      = event?.date    || localDateStr(new Date());
  document.getElementById('ev-date-end').value  = event?.dateEnd || event?.date || localDateStr(new Date());
  document.getElementById('ev-time').value      = event?.time    || '09:00';
  document.getElementById('ev-time-end').value  = event?.timeEnd || '10:00';

  selectedColor = event?.color || COLORS[0];
  buildColorPicker();

  selectedUserIds = new Set(event?.userIds || [currentUser.uid]);

  // Load users for checkboxes
  if (allUsers.length === 0) await loadUsers();
  buildUserCheckboxes();

  // Delete button
  const delWrap = document.getElementById('ev-delete-wrap');
  if (event) {
    delWrap.innerHTML = '<button class="btn btn-danger" id="btn-delete-event">Delete Event</button>';
    document.getElementById('btn-delete-event').addEventListener('click', deleteEvent);
  } else {
    delWrap.innerHTML = '';
  }

  document.getElementById('modal-event').classList.add('open');
}

function buildUserCheckboxes() {
  const list = document.getElementById('ev-users-list');
  list.innerHTML = '';
  allUsers.forEach(u => {
    const item = document.createElement('label');
    item.className = 'checkbox-item';
    item.innerHTML = `
      <input type="checkbox" value="${u.id}" ${selectedUserIds.has(u.id)?'checked':''}>
      <div>
        <div style="font-size:14px;font-weight:500">${u.name}</div>
        <div style="font-size:12px;color:var(--sub);font-family:var(--mono)">${u.email}</div>
      </div>
    `;
    item.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) selectedUserIds.add(u.id);
      else selectedUserIds.delete(u.id);
    });
    list.appendChild(item);
  });
}

function closeEventModal() {
  document.getElementById('modal-event').classList.remove('open');
  editingEventId = null;
}

async function saveEvent() {
  const title = document.getElementById('ev-title').value.trim();
  const type  = document.getElementById('ev-type').value.trim();
  const date  = document.getElementById('ev-date').value;
  const time  = document.getElementById('ev-time').value;

  if (!title || !date) return toast('Please fill in title and date', 'error');

  const { db, collection, doc, setDoc, addDoc, updateDoc } = window.__fb;

  const payload = {
    title,
    type: type || 'event',
    date,
    dateEnd: document.getElementById('ev-date-end').value || date,
    time,
    timeEnd: document.getElementById('ev-time-end').value || '',
    color: selectedColor,
    userIds: Array.from(selectedUserIds),
    createdBy: currentUser.uid,
    updatedAt: Date.now()
  };

  try {
    if (editingEventId) {
      await updateDoc(doc(db,'events',editingEventId), payload);
      toast('Event updated');
    } else {
      await addDoc(collection(db,'events'), { ...payload, createdAt: Date.now() });
      toast('Event created');
    }
    closeEventModal();
    renderSchedule();
  } catch(e) {
    toast(e.message, 'error');
  }
}

async function deleteEvent() {
  if (!editingEventId) return;
  if (!confirm('Delete this event?')) return;
  const { db, doc, deleteDoc } = window.__fb;
  await deleteDoc(doc(db,'events',editingEventId));
  closeEventModal();
  renderSchedule();
  toast('Event deleted');
}

// ── EVENT DETAIL (user) ────────────────────────────────────
async function openEventDetail(ev) {
  if (allUsers.length === 0) await loadUsers();
  document.getElementById('detail-title').textContent = ev.title;
  document.getElementById('detail-color-bar').style.background = ev.color || '#4f8fff';
  const startLabel = new Date(ev.date+'T00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const endLabel   = (ev.dateEnd && ev.dateEnd !== ev.date)
    ? new Date(ev.dateEnd+'T00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})
    : null;
  const dateRange  = endLabel ? `${startLabel} – ${endLabel}` : startLabel;
  const timeRange  = ev.timeEnd
    ? `${formatTime(null,ev.time)} – ${formatTime(null,ev.timeEnd)}`
    : formatTime(null,ev.time);
  document.getElementById('detail-datetime').textContent = `${dateRange} · ${timeRange}`;
  document.getElementById('detail-type').textContent = ev.type || 'event';

  const sharedRow = document.getElementById('detail-shared-row');
  const sharedUsers = document.getElementById('detail-shared-users');
  sharedUsers.innerHTML = '';

  if (ev.userIds && ev.userIds.length > 1) {
    sharedRow.style.display = 'flex';
    ev.userIds.forEach(uid => {
      const tag = document.createElement('span');
      tag.className = 'user-tag';
      const u = allUsers.find(u => u.id === uid);
      tag.textContent = uid === currentUser.uid ? 'You' : (u ? u.name : uid.slice(0,8)+'…');
      sharedUsers.appendChild(tag);
    });
  } else {
    sharedRow.style.display = 'none';
  }

  document.getElementById('modal-event-detail').classList.add('open');
}

// ── USERS ─────────────────────────────────────────────────
async function loadUsers() {
  const { db, collection, getDocs } = window.__fb;
  const snap = await getDocs(collection(db,'users'));
  allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  const list = document.getElementById('users-list');
  if (!list) return;
  list.innerHTML = '';
  allUsers.forEach(u => {
    const card = document.createElement('div');
    card.className = 'user-card';
    card.innerHTML = `
      <div class="avatar">${(u.name||'U').charAt(0).toUpperCase()}</div>
      <div class="user-card-info">
        <div class="user-name">${u.name}</div>
        <div class="user-email">${u.email}</div>
      </div>
      <span class="role-badge ${u.role==='moderator'?'mod':'user'}">${u.role==='moderator'?'Mod':'User'}</span>
    `;
    list.appendChild(card);
  });
}

async function createUser() {
  const name     = document.getElementById('new-user-name').value.trim();
  const username = document.getElementById('new-user-username').value.trim().toLowerCase();
  const email    = document.getElementById('new-user-email').value.trim();
  const pass     = document.getElementById('new-user-pass').value;
  const role     = document.getElementById('new-user-role').value;
  const errEl    = document.getElementById('add-user-error');
  errEl.style.display = 'none';

  if (!name || !username || !email || !pass) {
    errEl.textContent = 'Please fill all fields';
    errEl.style.display = 'block';
    return;
  }

  try {
    const { auth, db, createUserWithEmailAndPassword, doc, setDoc, collection, query, where, getDocs } = window.__fb;

    // Check username is unique
    const uq = query(collection(db,'users'), where('username','==',username));
    const usnap = await getDocs(uq);
    if (!usnap.empty) {
      errEl.textContent = 'Username already taken';
      errEl.style.display = 'block';
      return;
    }

    const result = await createUserWithEmailAndPassword(auth, email, pass);
    const newUid = result.user.uid;

    await setDoc(doc(db,'users',newUid), { name, username, email, role, createdAt: Date.now() });

    // Sign back in as the moderator
    // (Firebase automatically signs in newly created user — workaround: sign mod back in)
    // We'll use a second auth app or warn the user. For simplicity, re-auth mod after.
    toast('User created! You may need to sign in again.', 'success');
    document.getElementById('modal-add-user').classList.remove('open');
    allUsers = [];
    loadUsers();

    // Re-sign in moderator
    // (store their email/pass — not ideal in prod; use Admin SDK in production)
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

// ── SEARCH (mod) ──────────────────────────────────────────
async function doSearch() {
  const time = document.getElementById('search-time').value;
  const type = document.getElementById('search-type').value;
  const date = document.getElementById('search-date').value;

  if (!date) return toast('Please select a date', 'error');

  const { db, collection, query, where, getDocs } = window.__fb;

  const results = document.getElementById('search-results');
  results.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';

  let q = query(collection(db,'events'), where('date','==',date));
  const snap = await getDocs(q);
  let events = snap.docs.map(d => ({ id:d.id, ...d.data() }));

  if (type) events = events.filter(e => e.type === type);

  if (time) {
    // Filter events that overlap the given time (we treat events as point-in-time)
    // Show events within 1 hour of the search time
    events = events.filter(e => {
      if (!e.time) return false;
      const [eh,em] = e.time.split(':').map(Number);
      const [sh,sm] = time.split(':').map(Number);
      const eMins = eh*60+em, sMins = sh*60+sm;
      return Math.abs(eMins - sMins) <= 60;
    });
  }

  if (allUsers.length === 0) await loadUsers();

  results.innerHTML = '';

  if (events.length === 0) {
    results.innerHTML = '<div style="text-align:center;padding:32px;color:var(--muted);font-family:var(--mono);font-size:13px;">No events found</div>';
    return;
  }

  events.forEach(ev => {
    const card = document.createElement('div');
    card.className = 'result-card';

    const assignedUsers = (ev.userIds||[]).map(uid => {
      const u = allUsers.find(u => u.id === uid);
      return u ? u.name : uid.slice(0,8)+'…';
    });

    card.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        <div style="width:10px;height:10px;border-radius:50%;background:${ev.color||'#4f8fff'};flex-shrink:0"></div>
        <div class="result-event-title" style="margin:0">${ev.title}</div>
      </div>
      <div style="font-family:var(--mono);font-size:12px;color:var(--sub);">${formatTime(null,ev.time)}${ev.timeEnd?' – '+formatTime(null,ev.timeEnd):''} · <span class="event-type-pill" style="display:inline">${ev.type}</span></div>
      <div class="result-users">
        ${assignedUsers.map(n => `<span class="user-tag">${n}</span>`).join('')}
      </div>
    `;
    results.appendChild(card);
  });
}

// ── PROFILE ───────────────────────────────────────────────
function renderProfile() {
  document.getElementById('profile-email').textContent = userProfile?.email || '—';
  document.getElementById('profile-name').textContent  = userProfile?.name  || '—';
  document.getElementById('profile-role').textContent  = userProfile?.role  || '—';
}

// ── CLOSE MODALS ON OVERLAY CLICK ─────────────────────────
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});
</script>
