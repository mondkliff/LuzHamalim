<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>לוח חמלים</title>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, doc, setDoc, getDoc, getDocs,
    addDoc, updateDoc, deleteDoc, query, where, orderBy, Timestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBZwWLwUenT82KVnvC6ZqyD2xuODvtLlCA",
    authDomain: "hamalim-f60dc.firebaseapp.com",
    projectId: "hamalim-f60dc",
    storageBucket: "hamalim-f60dc.firebasestorage.app",
    messagingSenderId: "4462919907",
    appId: "1:4462919907:web:922f1ef28380bfe655c5d6"
  };

  const app   = initializeApp(firebaseConfig);
  const auth  = getAuth(app);
  const db    = getFirestore(app);

  window.__fb = { auth, db, signInWithEmailAndPassword, signOut, onAuthStateChanged,
    createUserWithEmailAndPassword, collection, doc, setDoc, getDoc, getDocs,
    addDoc, updateDoc, deleteDoc, query, where, orderBy, Timestamp };
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg:       #0d0f14;
    --surface:  #161922;
    --card:     #1e2230;
    --border:   #2a2f3e;
    --muted:    #4a5068;
    --text:     #e8eaf0;
    --sub:      #8890aa;
    --accent:   #4f8fff;
    --accent2:  #ff6b6b;
    --green:    #4ecb71;
    --yellow:   #f5c542;
    --purple:   #a78bfa;
    --orange:   #fb923c;
    --pink:     #f472b6;
    --radius:   12px;
    --mono:     'DM Mono', monospace;
    --sans:     'DM Sans', sans-serif;
    --nav-h:    56px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
    direction: rtl;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .screen { display: none; min-height: 100dvh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ── AUTH ── */
  #screen-auth {
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    background: var(--bg);
    direction: rtl;
  }

  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    width: 100%;
  }

  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--sub);
    letter-spacing: 0.04em;
    margin-bottom: 6px;
    text-align: right;
  }

  .form-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: var(--sans);
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    direction: rtl;
    text-align: right;
  }
  .form-input:focus { border-color: var(--accent); }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: 0.01em;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--sub);
    margin-top: 10px;
  }
  .btn-danger { background: var(--accent2); color: #fff; }
  .btn-sm {
    width: auto;
    padding: 8px 16px;
    font-size: 13px;
    border-radius: 6px;
  }

  .auth-error {
    background: rgba(255,107,107,0.12);
    border: 1px solid rgba(255,107,107,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--accent2);
    margin-bottom: 14px;
    display: none;
    text-align: right;
  }

  /* ── TOP BAR ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: var(--nav-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-logo {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.12em;
  }

  .topbar-user {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    flex-shrink: 0;
  }

  .role-badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: 0.04em;
  }
  .role-badge.mod  { background: rgba(79,143,255,0.15); color: var(--accent); }
  .role-badge.user { background: rgba(78,203,113,0.15); color: var(--green); }

  /* BUG FIX: was `display: block` — icons weren't centering */
  .icon-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--sub);
    transition: color 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }
  .icon-btn svg { width: 18px; height: 18px; display: block; }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }

  .main-content {
    flex: 1;
    overflow-y: auto;
    padding: 0 0 80px;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    padding: 20px 20px 8px;
    text-align: right;
  }

  /* ── WEEK NAV ── */
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
  }

  .week-label {
    font-size: 17px;
    font-weight: 600;
    text-align: center;
    flex: 1;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .week-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--sub);
    display: block;
    font-weight: 400;
    margin-top: 3px;
    direction: ltr;
    letter-spacing: 0;
  }

  /* ── DAY LIST ── */
  .day-block {
    margin: 0 20px 16px;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .day-header {
    background: var(--surface);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-direction: row-reverse;
    justify-content: flex-end;
  }

  .day-name { font-size: 13px; font-weight: 500; color: var(--sub); }
  .day-date { font-size: 14px; font-weight: 600; color: var(--text); }

  .day-today .day-name { color: var(--accent); }
  .day-today .day-date {
    background: var(--accent);
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }

  .events-list { background: var(--card); }

  .event-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
    flex-direction: row-reverse;
  }
  .event-item:last-child { border-bottom: none; }
  .event-item:hover { background: rgba(255,255,255,0.03); }

  .event-color-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }

  .event-info { flex: 1; min-width: 0; text-align: right; }

  .event-title {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
    letter-spacing: -0.2px;
  }

  .event-meta {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--sub);
    margin-top: 3px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    direction: ltr;
  }

  .event-type-pill {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.07);
    color: var(--sub);
    margin-top: 5px;
    display: inline-block;
  }

  .shared-badge {
    font-size: 11px;
    color: var(--purple);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: flex-end;
  }

  .empty-day {
    background: var(--card);
    padding: 18px;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
  }

  /* ── FAB ── */
  .fab {
    position: fixed;
    bottom: 24px;
    left: 24px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(79,143,255,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    z-index: 200;
  }
  .fab:active { transform: scale(0.93); }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 150;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 0 12px;
    cursor: pointer;
    color: var(--muted);
    transition: color 0.2s;
    font-size: 11px;
    gap: 4px;
    border: none;
    background: none;
    font-family: var(--sans);
  }
  .nav-item svg { width: 22px; height: 22px; display: block; stroke: currentColor; }
  .nav-item.active { color: var(--accent); }

  .hidden { display: none !important; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 500;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }

  .modal-sheet {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 430px;
    max-height: 90dvh;
    overflow-y: auto;
    padding: 8px 0 40px;
    animation: slideUp 0.25s ease;
    direction: rtl;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    margin: 0 auto 20px;
  }

  .modal-title {
    font-size: 19px;
    font-weight: 600;
    padding: 0 24px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
    text-align: right;
    letter-spacing: -0.3px;
  }

  .modal-body { padding: 0 24px; }

  /* ── TYPE SELECTOR ── */
  .type-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }

  .type-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--sub);
    transition: all 0.15s;
    white-space: nowrap;
    font-family: var(--sans);
  }
  .type-pill.selected {
    background: rgba(79,143,255,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── COLOR PICKER ── */
  .color-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }

  .color-swatch {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: border-color 0.15s, transform 0.15s;
    flex-shrink: 0;
  }
  .color-swatch:active { transform: scale(0.9); }
  .color-swatch.selected { border-color: var(--text); }

  /* ── SEARCH SCREEN ── */
  .search-bar { display: flex; gap: 10px; padding: 16px 20px 8px; direction: rtl; }

  .filter-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 16px;
    font-size: 13px;
    font-family: var(--sans);
    cursor: pointer;
    color: var(--sub);
    transition: all 0.15s;
    white-space: nowrap;
    font-weight: 500;
  }
  .filter-chip.active {
    background: rgba(79,143,255,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  .results-section { padding: 0 20px; }

  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    text-align: right;
  }

  .result-event-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.2px; }
  .result-users { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }

  .user-tag {
    background: rgba(79,143,255,0.12);
    border: 1px solid rgba(79,143,255,0.25);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    color: var(--accent);
  }

  /* ── USERS PAGE ── */
  .users-list { padding: 0 20px; }

  .user-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-direction: row-reverse;
  }

  .user-card-info { flex: 1; min-width: 0; text-align: right; }
  .user-name { font-size: 14px; font-weight: 600; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 88px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 500;
    z-index: 1000;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
    max-width: 340px;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success { border-color: rgba(78,203,113,0.4); color: var(--green); }
  #toast.error   { border-color: rgba(255,107,107,0.4); color: var(--accent2); }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 40px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-wrap { display: flex; justify-content: center; padding: 40px; }

  /* ── EVENT DETAIL ── */
  .event-detail-color-bar { height: 5px; border-radius: 3px; margin-bottom: 20px; }

  .detail-row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 16px;
    flex-direction: row-reverse;
  }

  .detail-icon { color: var(--sub); flex-shrink: 0; margin-top: 2px; }
  .detail-label { font-size: 11px; color: var(--sub); margin-bottom: 3px; font-family: var(--mono); letter-spacing: 0.04em; text-align: right; }
  .detail-value { font-size: 15px; font-weight: 500; text-align: right; }

  /* ── CHECKBOX ── */
  .checkbox-list { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    flex-direction: row-reverse;
  }
  .checkbox-item input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
  .checkbox-item .cb-info { flex: 1; text-align: right; }

  /* ── DATE TIME ROW ── */
  .dt-row { display: flex; gap: 10px; }
  .dt-row .form-group { flex: 1; }

  input[type=date], input[type=time] { direction: ltr; text-align: left; }
  #search-date, #search-time { direction: ltr; text-align: left; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="screen-auth" class="screen active">
  <div style="text-align:center; margin-bottom: 16px;">
    <div style="font-size:36px; font-weight:700; color:var(--text); line-height:1.2; margin-bottom:8px;">לוז חמלים</div>
    <div style="font-size:14px; color:var(--sub);">ברוכים הבאים</div>
  </div>
  <div class="auth-card">
    <div class="auth-error" id="auth-error"></div>
    <div class="form-group">
      <label class="form-label">שם משתמש</label>
      <input class="form-input" type="text" id="auth-username" placeholder="שם המשתמש שלך" autocomplete="username" style="direction:ltr;text-align:left;">
    </div>
    <div class="form-group">
      <label class="form-label">סיסמה</label>
      <input class="form-input" type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password" style="direction:ltr;text-align:left;">
    </div>
    <button class="btn btn-primary" id="btn-login">כניסה</button>
    <div style="text-align:center; margin-top: 20px; font-size:13px; color:var(--muted);">
      ליצירת משתמש יש ליצור קשר עם מנהל המערכת
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="screen-app" class="screen">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-user">
      <span id="topbar-role-badge" class="role-badge"></span>
      <div class="avatar" id="topbar-avatar">?</div>
      <button class="icon-btn" id="btn-logout" title="יציאה">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
      </button>
    </div>
    <div class="topbar-logo">-_-</div>
  </div>

  <div class="main-content">

    <!-- SCHEDULE PAGE -->
    <div id="page-schedule" class="page">
      <div class="week-nav">
        <button class="icon-btn" id="btn-week-next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <div style="flex:1;text-align:center;">
          <div class="week-label" id="week-label">הלוז שלי</div>
          <span class="week-sub" id="week-sub"></span>
        </div>
        <button class="icon-btn" id="btn-week-prev">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <div id="schedule-container"></div>
    </div>

    <!-- SEARCH PAGE (mod only) -->
    <div id="page-search" class="page" style="display:none">
      <div class="section-label">חיפוש אירועים</div>
      <div class="search-bar">
        <input class="form-input" id="search-date" type="date" style="flex:1;">
        <input class="form-input" id="search-time" type="time" style="width:110px;">
      </div>
      <div style="padding: 0 20px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
        <button class="btn btn-primary btn-sm" id="btn-do-search">חפש</button>
      </div>
      <div style="padding: 0 20px 12px; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;" id="search-type-filters"></div>
      <div class="results-section" id="search-results"></div>
    </div>

    <!-- USERS PAGE (mod only) -->
    <div id="page-users" class="page" style="display:none">
      <div style="padding: 16px 20px 8px;">

<!-- ════════════════ APP LOGIC ════════════════ -->
<script>
function waitForFirebase(cb) {
  if (window.__fb) return cb();
  setTimeout(() => waitForFirebase(cb), 100);
}

const COLORS = ['#4f8fff','#ff6b6b','#4ecb71','#f5c542','#a78bfa','#fb923c','#f472b6','#22d3ee','#e879f9','#94a3b8'];
const EVENT_TYPES = ['משמרת','זירות','תורנות','שיעור'];

let currentUser       = null;
let userProfile       = null;
let allUsers          = [];
let currentWeekOffset = 0;
let editingEventId    = null;
let selectedColor     = COLORS[0];
let selectedUserIds   = new Set();
let selectedType      = EVENT_TYPES[0];

// ── UTILS ──────────────────────────────────
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = '', 2800);
}

function localDateStr(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function formatTime(timeStr) {
  if (!timeStr) return '—';
  return timeStr.slice(0, 5);
}

function getWeekStart(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay());
  return d;
}

function getWeekDates(offset) {
  const sunday = getWeekStart(new Date());
  sunday.setDate(sunday.getDate() + offset * 7);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    return d;
  });
}

function isModerator() {
  return userProfile && userProfile.role === 'moderator';
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => { p.style.display = 'none'; });
  document.getElementById(`page-${name}`).style.display = 'block';
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.page === name);
  });
  if (name === 'schedule') renderSchedule();
  if (name === 'users' && isModerator()) loadUsers();
  if (name === 'search') buildSearchTypeFilters();
}

// ── AUTH ───────────────────────────────────
waitForFirebase(() => {
  const { auth, onAuthStateChanged } = window.__fb;

  onAuthStateChanged(auth, async user => {
    if (user) {
      currentUser = user;
      await loadUserProfile(user.uid);
      showScreen('screen-app');
      initApp();
    } else {
      currentUser = null;
      userProfile = null;
      showScreen('screen-auth');
    }
  });

  document.getElementById('btn-login').addEventListener('click', async () => {
    const username = document.getElementById('auth-username').value.trim();
    const pass     = document.getElementById('auth-password').value;
    const errEl    = document.getElementById('auth-error');
    errEl.style.display = 'none';
    if (!username || !pass) {
      errEl.textContent = 'יש להכניס שם משתמש וסיסמה';
      errEl.style.display = 'block';
      return;
    }
    try {
      const { db, collection, query, where, getDocs } = window.__fb;
      const q    = query(collection(db, 'users'), where('username', '==', username));
      const snap = await getDocs(q);
      if (snap.empty) throw new Error('משתמש לא נמצא');
      const userData = snap.docs[0].data();
      if (!userData.email) throw new Error('אין כתובת מייל מוגדרת לחשבון זה');
      await window.__fb.signInWithEmailAndPassword(auth, userData.email, pass);
    } catch(e) {
      errEl.textContent = e.message === 'Firebase: Error (auth/invalid-credential).'
        ? 'סיסמה שגויה'
        : e.message;
      errEl.style.display = 'block';
    }
  });

  document.getElementById('btn-logout').addEventListener('click', () => window.__fb.signOut(auth));
});

async function loadUserProfile(uid) {
  const { db, doc, getDoc, setDoc } = window.__fb;
  const snap = await getDoc(doc(db, 'users', uid));
  if (snap.exists()) {
    userProfile = { id: uid, ...snap.data() };
  } else {
    userProfile = { id: uid, name: currentUser.email, email: currentUser.email, role: 'user' };
    await setDoc(doc(db, 'users', uid), userProfile);
  }
}

// ── INIT ───────────────────────────────────
function initApp() {
  const isMod = isModerator();

  const badge = document.getElementById('topbar-role-badge');
  badge.textContent = isMod ? 'Mod' : 'User';
  badge.className = `role-badge ${isMod ? 'mod' : 'user'}`;
  document.getElementById('topbar-avatar').textContent =
    (userProfile.name || 'U').charAt(0).toUpperCase();

  // Moderator-only UI
  if (isMod) {
    document.getElementById('bottom-nav').classList.remove('hidden');
    document.getElementById('fab').classList.remove('hidden');
  }

  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => showPage(btn.dataset.page));
  });

  buildColorPicker();

  document.getElementById('fab').addEventListener('click', () => openEventModal(null));

  // BUG FIX: guard lower bound so users can't scroll infinitely into the past
  document.getElementById('btn-week-prev').addEventListener('click', () => {
    if (currentWeekOffset <= -4) {
      toast('לא ניתן לחזור כה אחורה', 'error');
      return;
    }
    currentWeekOffset--;
    renderSchedule();
  });

  document.getElementById('btn-week-next').addEventListener('click', () => {
    const maxOffset = isMod ? 4 : 1;
    if (currentWeekOffset >= maxOffset) {
      toast('לא ניתן לצפות בלוז כה רחוק', 'error');
      return;
    }
    currentWeekOffset++;
    renderSchedule();
  });

  document.getElementById('btn-cancel-event').addEventListener('click', closeEventModal);
  document.getElementById('btn-save-event').addEventListener('click', saveEvent);
  document.getElementById('btn-close-detail').addEventListener('click', () => {
    document.getElementById('modal-event-detail').classList.remove('open');
  });
  document.getElementById('btn-do-search').addEventListener('click', doSearch);

  showPage('schedule');
}

// ── COLOR PICKER ───────────────────────────
function buildColorPicker() {
  const container = document.getElementById('color-picker');
  container.innerHTML = '';
  COLORS.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (c === selectedColor ? ' selected' : '');
    sw.style.background = c;
    sw.addEventListener('click', () => {
      selectedColor = c;
      container.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
    });
    container.appendChild(sw);
  });
}

// ── TYPE PILL SELECTOR ─────────────────────
function buildTypePills(containerId, currentType, onSelect) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  EVENT_TYPES.forEach(t => {
    const pill = document.createElement('button');
    pill.className = 'type-pill' + (t === currentType ? ' selected' : '');
    pill.textContent = t;
    pill.addEventListener('click', () => {
      onSelect(t);
      container.querySelectorAll('.type-pill').forEach(p => p.classList.remove('selected'));
      pill.classList.add('selected');
    });
    container.appendChild(pill);
  });
}

// ── SEARCH TYPE FILTERS ────────────────────
let searchTypeFilter = '';

function buildSearchTypeFilters() {
  const container = document.getElementById('search-type-filters');
  container.innerHTML = '';

  const allChip = document.createElement('button');
  allChip.className = 'filter-chip' + (searchTypeFilter === '' ? ' active' : '');
  allChip.textContent = 'הכל';
  allChip.addEventListener('click', () => { searchTypeFilter = ''; buildSearchTypeFilters(); });
  container.appendChild(allChip);

  EVENT_TYPES.forEach(t => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip' + (searchTypeFilter === t ? ' active' : '');
    chip.textContent = t;
    chip.addEventListener('click', () => { searchTypeFilter = t; buildSearchTypeFilters(); });
    container.appendChild(chip);
  });
}

// ── TIME DISPLAY ───────────────────────────
function getEventTimeDisplay(ev, currentDateStr) {
  const isMultiDay = ev.dateEnd && ev.dateEnd !== ev.date;
  if (!isMultiDay) {
    return ev.time
      ? (ev.timeEnd ? `${formatTime(ev.time)} – ${formatTime(ev.timeEnd)}` : formatTime(ev.time))
      : '—';
  }
  if (currentDateStr === ev.date)    return `${formatTime(ev.time)} – 23:59`;
  if (currentDateStr === ev.dateEnd) return `00:00 – ${formatTime(ev.timeEnd)}`;
  return '00:00 – 23:59';
}

// ── SCHEDULE ───────────────────────────────
async function renderSchedule() {
  const container = document.getElementById('schedule-container');
  if (!container) return;
  container.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';

  const days  = getWeekDates(currentWeekOffset);
  const today = new Date(); today.setHours(0, 0, 0, 0);

  const wStart = days[0], wEnd = days[6];
  const opts   = { month: 'short', day: 'numeric' };
  document.getElementById('week-sub').textContent =
    `${wStart.toLocaleDateString('en-US', opts)} – ${wEnd.toLocaleDateString('en-US', opts)}`;
  document.getElementById('week-label').textContent = 'הלוז שלי';

  const dateStrings = days.map(d => localDateStr(d));
  let events = [];
  try {
    events = await fetchEventsForDates(dateStrings);
  } catch(e) {
    container.innerHTML = `<div style="padding:24px;text-align:center;color:var(--accent2);font-size:14px;">${e.message}</div>`;
    return;
  }

  if (isModerator() && allUsers.length === 0) await loadUsers();

  container.innerHTML = '';
  const dayNames = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

  days.forEach(day => {
    const dateStr   = localDateStr(day);
    const dayEvents = events
      .filter(e => { const end = e.dateEnd || e.date; return dateStr >= e.date && dateStr <= end; })
      .sort((a, b) => (a.time || '').localeCompare(b.time || ''));

    const isToday = day.getTime() === today.getTime();

    const block = document.createElement('div');
    block.className = 'day-block' + (isToday ? ' day-today' : '');
    block.innerHTML = `
      <div class="day-header">
        <span class="day-name">יום ${dayNames[day.getDay()]}</span>
        <span class="day-date">${day.getDate()}</span>
      </div>
      <div class="events-list" id="day-${dateStr}"></div>
    `;

    const list = block.querySelector(`#day-${dateStr}`);

    if (dayEvents.length === 0) {
      list.innerHTML = '<div class="empty-day">אין אירועים</div>';
    } else {
      dayEvents.forEach(ev => {
        const item     = document.createElement('div');
        item.className = 'event-item';
        const isShared = ev.userIds && ev.userIds.length > 1;

        item.innerHTML = `
          ${isModerator() ? `
            <svg style="color:var(--muted);flex-shrink:0;margin-top:4px" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>` : ''}
          <div class="event-info">
            <div class="event-title">${ev.title}</div>
            <div class="event-meta"><span>${getEventTimeDisplay(ev, dateStr)}</span></div>
            <span class="event-type-pill">${ev.type || 'אירוע'}</span>
            ${isShared ? `
              <div class="shared-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
                </svg>
                אירוע משותף
              </div>` : ''}
          </div>
          <div class="event-color-dot" style="background:${ev.color || '#4f8fff'}"></div>
        `;

        item.addEventListener('click', () => {
          if (isModerator()) openEventModal(ev);
          else openEventDetail(ev);
        });

        list.appendChild(item);
      });
    }

    container.appendChild(block);
  });
}

async function fetchEventsForDates(dateStrings) {
  const { db, collection, query, where, getDocs } = window.__fb;
  const first = dateStrings[0], last = dateStrings[dateStrings.length - 1];

  const q = isModerator()
    ? query(collection(db, 'events'), where('date', '<=', last), where('date', '>=', first))
    : query(collection(db, 'events'),
        where('date', '>=', first),
        where('date', '<=', last),
        where('userIds', 'array-contains', currentUser.uid));

  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

// ── EVENT MODAL ────────────────────────────
async function openEventModal(event) {
  editingEventId = event ? event.id : null;

  document.getElementById('modal-event-title').textContent = event ? 'עריכת אירוע' : 'אירוע חדש';
  document.getElementById('ev-title').value    = event?.title   || '';
  document.getElementById('ev-date').value     = event?.date    || localDateStr(new Date());
  document.getElementById('ev-date-end').value = event?.dateEnd || event?.date || localDateStr(new Date());
  document.getElementById('ev-time').value     = event?.time    || '09:00';
  document.getElementById('ev-time-end').value = event?.timeEnd || '10:00';

  selectedType  = event?.type  || EVENT_TYPES[0];
  selectedColor = event?.color || COLORS[0];
  buildColorPicker();
  buildTypePills('ev-type-selector', selectedType, t => { selectedType = t; });

  selectedUserIds = new Set(event?.userIds || []);
  if (allUsers.length === 0) await loadUsers();
  buildUserCheckboxes();

  const delWrap = document.getElementById('ev-delete-wrap');
  if (event) {
    delWrap.innerHTML = '<button class="btn btn-danger" id="btn-delete-event">מחק אירוע</button>';
    document.getElementById('btn-delete-event').addEventListener('click', deleteEvent);
  } else {
    delWrap.innerHTML = '';
  }

  document.getElementById('modal-event').classList.add('open');
}

function buildUserCheckboxes() {
  const list = document.getElementById('ev-users-list');
  list.innerHTML = '';
  allUsers.forEach(u => {
    const item = document.createElement('label');
    item.className = 'checkbox-item';
    // Show name only — no email
    item.innerHTML = `
      <input type="checkbox" value="${u.id}" ${selectedUserIds.has(u.id) ? 'checked' : ''}>
      <div class="cb-info">
        <div style="font-size:14px;font-weight:600">${u.name}</div>
      </div>
    `;
    item.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) selectedUserIds.add(u.id);
      else selectedUserIds.delete(u.id);
    });
    list.appendChild(item);
  });
}

function closeEventModal() {
  document.getElementById('modal-event').classList.remove('open');
  editingEventId = null;
}

async function saveEvent() {
  const title = document.getElementById('ev-title').value.trim();
  const date  = document.getElementById('ev-date').value;
  if (!title || !date) return toast('יש להכניס כותרת ותאריך', 'error');

  const { db, collection, doc, addDoc, updateDoc } = window.__fb;
  const payload = {
    title,
    type:      selectedType,
    date,
    dateEnd:   document.getElementById('ev-date-end').value || date,
    time:      document.getElementById('ev-time').value,
    timeEnd:   document.getElementById('ev-time-end').value || '',
    color:     selectedColor,
    userIds:   Array.from(selectedUserIds),
    createdBy: currentUser.uid,
    updatedAt: Date.now()
  };

  try {
    if (editingEventId) {
      await updateDoc(doc(db, 'events', editingEventId), payload);
      toast('האירוע עודכן');
    } else {
      await addDoc(collection(db, 'events'), { ...payload, createdAt: Date.now() });
      toast('האירוע נוסף');
    }
    closeEventModal();
    renderSchedule();
  } catch(e) {
    toast(e.message, 'error');
  }
}

async function deleteEvent() {
  if (!editingEventId) return;
  if (!confirm('למחוק את האירוע?')) return;
  const { db, doc, deleteDoc } = window.__fb;
  await deleteDoc(doc(db, 'events', editingEventId));
  closeEventModal();
  renderSchedule();
  toast('האירוע נמחק');
}

// ── EVENT DETAIL ───────────────────────────
async function openEventDetail(ev) {
  if (allUsers.length === 0) await loadUsers();

  document.getElementById('detail-title').textContent = ev.title;
  document.getElementById('detail-color-bar').style.background = ev.color || '#4f8fff';

  const startLabel = new Date(ev.date + 'T00:00').toLocaleDateString('he-IL', { weekday:'short', month:'short', day:'numeric' });
  const endLabel   = (ev.dateEnd && ev.dateEnd !== ev.date)
    ? new Date(ev.dateEnd + 'T00:00').toLocaleDateString('he-IL', { weekday:'short', month:'short', day:'numeric' })
    : null;
  const dateRange = endLabel ? `${startLabel} – ${endLabel}` : startLabel;
  const timeRange = ev.timeEnd
    ? `${formatTime(ev.time)} – ${formatTime(ev.timeEnd)}`
    : formatTime(ev.time);

  document.getElementById('detail-datetime').textContent = `${dateRange} · ${timeRange}`;
  document.getElementById('detail-type').textContent = ev.type || 'אירוע';

  const sharedRow   = document.getElementById('detail-shared-row');
  const sharedUsers = document.getElementById('detail-shared-users');
  sharedUsers.innerHTML = '';

  if (ev.userIds && ev.userIds.length > 1) {
    sharedRow.style.display = 'flex';
    ev.userIds.forEach(uid => {
      const tag = document.createElement('span');
      tag.className = 'user-tag';
      // Show name only — no email
      const u = allUsers.find(u => u.id === uid);
      tag.textContent = uid === currentUser.uid ? 'את/ה' : (u ? u.name : '…');
      sharedUsers.appendChild(tag);
    });
  } else {
    sharedRow.style.display = 'none';
  }

  document.getElementById('modal-event-detail').classList.add('open');
}

// ── USERS ──────────────────────────────────
async function loadUsers() {
  const { db, collection, getDocs } = window.__fb;
  const snap = await getDocs(collection(db, 'users'));
  allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  const list = document.getElementById('users-list');
  if (!list) return;
  list.innerHTML = '';
  allUsers.forEach(u => {
    const card = document.createElement('div');
    card.className = 'user-card';
    // Show name and role only — no email
    card.innerHTML = `
      <span class="role-badge ${u.role === 'moderator' ? 'mod' : 'user'}">${u.role === 'moderator' ? 'Mod' : 'User'}</span>
      <div class="user-card-info">
        <div class="user-name">${u.name}</div>
      </div>
      <div class="avatar">${(u.name || 'U').charAt(0).toUpperCase()}</div>
    `;
    list.appendChild(card);
  });
}

// ── SEARCH ─────────────────────────────────
function toMins(timeStr) {
  if (!timeStr) return 0;
  const [h, m] = timeStr.split(':').map(Number);
  return (h || 0) * 60 + (m || 0);
}

async function doSearch() {
  const date = document.getElementById('search-date').value;
  const time = document.getElementById('search-time').value;
  if (!date) return toast('יש לבחור תאריך', 'error');

  const { db, collection, query, where, getDocs } = window.__fb;
  const results = document.getElementById('search-results');
  results.innerHTML = '<div class="loading-wrap"><div class="spinner"></div></div>';

  const q    = query(collection(db, 'events'), where('date', '<=', date));
  const snap = await getDocs(q);
  let events = snap.docs
    .map(d => ({ id: d.id, ...d.data() }))
    .filter(e => (e.dateEnd || e.date) >= date);

  if (searchTypeFilter) events = events.filter(e => e.type === searchTypeFilter);

  if (time) {
    const searchMins = toMins(time);
    events = events.filter(e => {
      const isMultiDay = e.dateEnd && e.dateEnd !== e.date;
      if (isMultiDay) {
        if (date === e.date)    return searchMins >= toMins(e.time || '00:00');
        if (date === e.dateEnd) return searchMins <= toMins(e.timeEnd || '23:59');
        return true;
      }
      return searchMins >= toMins(e.time || '00:00') && searchMins <= toMins(e.timeEnd || '23:59');
    });
  }

  if (allUsers.length === 0) await loadUsers();

  results.innerHTML = '';
  if (events.length === 0) {
    results.innerHTML = '<div style="text-align:center;padding:32px;color:var(--muted);font-size:14px;">לא נמצאו אירועים</div>';
    return;
  }

  events.forEach(ev => {
    const card = document.createElement('div');
    card.className = 'result-card';

    // Show name only — no email
    const assignedUsers = (ev.userIds || []).map(uid => {
      const u = allUsers.find(u => u.id === uid);
      return u ? u.name : '…';
    });

    const timeDisplay = getEventTimeDisplay(ev, date);
    const isMultiDay  = ev.dateEnd && ev.dateEnd !== ev.date;

    card.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-direction:row-reverse;">
        <div class="result-event-title" style="margin:0;flex:1">${ev.title}</div>
        <div style="width:10px;height:10px;border-radius:50%;background:${ev.color || '#4f8fff'};flex-shrink:0"></div>
      </div>
      ${isMultiDay ? `<div style="font-size:11px;color:var(--purple);text-align:right;margin-bottom:2px;">📅 ${ev.date} → ${ev.dateEnd}</div>` : ''}
      <div style="font-family:var(--mono);font-size:12px;color:var(--sub);direction:ltr;text-align:left;">${timeDisplay}</div>
      <div style="margin-top:4px;text-align:right;"><span class="event-type-pill">${ev.type || 'אירוע'}</span></div>
      <div class="result-users">
        ${assignedUsers.map(n => `<span class="user-tag">${n}</span>`).join('')}
      </div>
    `;
    results.appendChild(card);
  });
}

// ── CLOSE MODALS ON OVERLAY CLICK ──────────
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});
</script>
